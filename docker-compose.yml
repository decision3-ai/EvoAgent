services:
  # Web frontend runs via: pnpm dev (from root)
  # Not containerized for local development

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    ports:
      - '8000:8000'
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  workers:
    build:
      context: ./apps/workers
      dockerfile: ../../infrastructure/docker/Dockerfile.workers
    env_file:
      - .env
    volumes:
      - ./apps/workers:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ./apps/workers
      dockerfile: ../../infrastructure/docker/Dockerfile.workers
    command: celery -A tasks beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    env_file:
      - .env
    volumes:
      - ./apps/workers:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentevo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agentevo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agentevo}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - '127.0.0.1:11434:11434'
    entrypoint: ['/bin/sh', '-c']
    command: ['ollama serve & sleep 5 && ollama pull nomic-embed-text && wait']
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
