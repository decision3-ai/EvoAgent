<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="EvoAgent octopus logo">
  <defs>
    <radialGradient id="bgCore" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0f1722"/>
      <stop offset="70%" stop-color="#091019"/>
      <stop offset="100%" stop-color="#060b12"/>
    </radialGradient>
    <linearGradient id="ringOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555b64"/>
      <stop offset="50%" stop-color="#2b313a"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ringMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20262f"/>
      <stop offset="100%" stop-color="#090d13"/>
    </linearGradient>

    <!-- Inkscape-safe shadow -->
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.30" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

