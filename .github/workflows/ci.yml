name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # Frontend: Lint + Type-check
  # ─────────────────────────────────────────
  frontend-checks:
    name: Frontend — Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @evoagent/web lint

      - name: Type-check
        run: pnpm --filter @evoagent/web type-check

  # ─────────────────────────────────────────
  # Backend: Lint + Tests
  # ─────────────────────────────────────────
  backend-checks:
    name: Backend — Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check apps/api/

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          echo "pytest apps/api/tests/ — coming soon"

  # ─────────────────────────────────────────
  # Docker: Build check
  # ─────────────────────────────────────────
  docker-build:
    name: Docker — Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api apps/api/

      - name: Build Workers image
        run: docker build -f infrastructure/docker/Dockerfile.workers apps/workers/
